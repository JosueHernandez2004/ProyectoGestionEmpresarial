<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Encargo Especial | AniVerse Corp.</title>
    <link rel="stylesheet" href="CSS/pagina.css">
</head>
<body>

    <header>
        <div class="header-left">
            <a href="pagina.html" class="logo-link">
                <img src="img-pagina/Aniverse.png" alt="Logo AniVerse Corp." class="header-logo">
                <h1>Aniverse Corp.</h1>
            </a>
        </div>
    </header>

    <div class="main-content-wrapper" style="max-width: 600px; margin: 40px auto; padding: 20px; background: #2f3542; border-radius: 8px; color: white;">
        <h2>Encargar un Producto Especial</h2>
        <p>¿Buscas una figura exclusiva o manga de importación especial? Envíanos tu solicitud.</p>

        <form id="form-encargo" onsubmit="guardarEncargoEspecial(event)">
            <label style="display:block; margin-top:15px;">Nombre Completo:</label>
            <input type="text" id="encargo-cliente" placeholder="Tu nombre" required style="width:100%; padding:10px; margin-top:5px; border-radius:4px; border:none;">

            <label style="display:block; margin-top:15px;">Teléfono / Contacto:</label>
            <input type="text" id="encargo-contacto" placeholder="+504 9999-9999" required style="width:100%; padding:10px; margin-top:5px; border-radius:4px; border:none;">

            <label style="display:block; margin-top:15px;">Artículo Solicitado:</label>
            <input type="text" id="encargo-articulo" placeholder="Ej: Figura Nendoroid Edición Limitada" required style="width:100%; padding:10px; margin-top:5px; border-radius:4px; border:none;">

            <label style="display:block; margin-top:15px;">Cantidad:</label>
            <input type="number" id="encargo-cantidad" value="1" min="1" required style="width:100%; padding:10px; margin-top:5px; border-radius:4px; border:none;">

            <label style="display:block; margin-top:15px;">Notas / Especificaciones:</label>
            <textarea id="encargo-notas" rows="3" placeholder="Detalles como idioma, escala, fabricante..." style="width:100%; padding:10px; margin-top:5px; border-radius:4px; border:none;"></textarea>

            <button type="submit" style="background:#2ed573; color:white; font-weight:bold; padding:12px 20px; border:none; border-radius:4px; margin-top:20px; cursor:pointer; width:100%;">Enviar Solicitud</button>
        </form>
    </div>

    <script>
        function guardarEncargoEspecial(e) {
            e.preventDefault();
            const cliente = document.getElementById('encargo-cliente').value;
            const contacto = document.getElementById('encargo-contacto').value;
            const articulo = document.getElementById('encargo-articulo').value;
            const cantidad = document.getElementById('encargo-cantidad').value;
            const notas = document.getElementById('encargo-notas').value;

            let pedidos = JSON.parse(localStorage.getItem('pedidosEspeciales')) || [];
            const nuevoId = pedidos.length + 1;

            pedidos.push({
                id: nuevoId,
                cliente,
                contacto,
                articulo,
                cantidad,
                notas,
                estado: 'Pendiente'
            });

            localStorage.setItem('pedidosEspeciales', JSON.stringify(pedidos));

            alert('Solicitud enviada correctamente. Revisaremos disponibilidad con los proveedores.');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
